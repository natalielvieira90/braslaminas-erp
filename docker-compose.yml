services:
  db:
    image: postgres:16-alpine
    container_name: braslaminas-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: braslaminas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d braslaminas"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: braslaminas-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: braslaminas
      JWT_SECRET: troque-este-segredo-em-producao
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/frontend:ro

volumes:
  pgdata:
